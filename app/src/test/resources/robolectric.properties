# Which Android these tests run against, said once instead of on every class.
#
# 36 is this app's compileSdk and targetSdk, and Robolectric 4.17 has an image
# for it, so the tests run against the same framework the app is built for
# rather than an older one standing in for it.
#
# Robolectric downloads that image from Maven Central the first time it is
# needed — around a hundred megabytes, once per machine.
sdk=36


# Not set here: `qualifiers`.
#
# A phone-sized screen (w411dp-h891dp-xhdpi) was tried, to make this run and
# the emulator run look at the same device. It made the rotation test hang —
# AppNotIdleException out of setContent, in a test that passes without it —
# and removing that one line made it green again, which is how we know.
#
# Why a screen size stops a composition settling is not understood here, and
# that is the reason it is not set: it was a bonus on top of a fix that
# already worked (0096 asks about existence rather than geometry), and it
# cost a passing test. Whoever tries it again should expect that hang.
